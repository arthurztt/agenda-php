<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Agenda</title>
    <!-- Tailwind CSS (CDN) -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Font Awesome Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
    <link rel="icon" type="image/x-icon" href="../imgs/favicon.ico">
</head>
<body class="text-slate-100 min-h-screen font-sans">
    <!-- Conteúdo Principal -->
    <main class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-24 py-20 space-y-8">
        <div class="main-title">
            <h1>Agenda Pessoal</h1>
            <p>Organize suas tarefas, evento, atividaes e reuniões de forma simples e unificada.</p>
        </div>
        <div class="new-note-div">
            <button id="btnOpenModal" class="w-full md:w-auto px-5 py-2.5 bg-indigo-600 hover:bg-indigo-500 text-white font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition-all flex items-center justify-center space-x-2">
                <i class="fa-solid fa-plus"></i>
                <span>Nova Anotação</span>
            </button>
        </div>
        <!-- Painel de Estatísticas -->
        <section class="grid grid-cols-2 md:grid-cols-4 gap-4">
            <div class="bg-slate-800/50 border border-slate-700/60 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-slate-400 uppercase tracking-wider">Total</p>
                    <h3 id="statTotal" class="text-2xl font-extrabold text-white mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-xl bg-slate-700/50 flex items-center justify-center text-slate-300">
                    <i class="fa-solid fa-layer-group"></i>
                </div>
            </div>

            <div class="bg-slate-800/50 border border-emerald-500/20 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-emerald-400 uppercase tracking-wider">Concluídas</p>
                    <h3 id="statCompleted" class="text-2xl font-extrabold text-emerald-400 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-xl bg-emerald-500/10 flex items-center justify-center text-emerald-400">
                    <i class="fa-solid fa-circle-check"></i>
                </div>
            </div>

            <div class="bg-slate-800/50 border border-amber-500/20 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-amber-400 uppercase tracking-wider">Pendentes</p>
                    <h3 id="statPending" class="text-2xl font-extrabold text-amber-400 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-xl bg-amber-500/10 flex items-center justify-center text-amber-400">
                    <i class="fa-solid fa-clock"></i>
                </div>
            </div>

            <div class="bg-slate-800/50 border border-rose-500/20 rounded-2xl p-4 flex items-center justify-between">
                <div>
                    <p class="text-xs font-medium text-rose-400 uppercase tracking-wider">Atrasadas</p>
                    <h3 id="statOverdue" class="text-2xl font-extrabold text-rose-400 mt-1">0</h3>
                </div>
                <div class="w-10 h-10 rounded-xl bg-rose-500/10 flex items-center justify-center text-rose-400">
                    <i class="fa-solid fa-triangle-exclamation"></i>
                </div>
            </div>
        </section>
        <!-- Barra de Busca e Filtros -->
        <section class="bg-slate-800/60 border border-slate-700/60 rounded-2xl p-4 flex flex-col md:flex-row items-center justify-between gap-4">
            <!-- Campo de Busca -->
            <div class="relative w-full md:w-80">
                <i class="fa-solid fa-magnifying-glass absolute left-3.5 top-1/2 -translate-y-1/2 text-slate-400"></i>
                <input type="text" id="searchInput" placeholder="Buscar por título ou descrição..." class="w-full bg-slate-900 border border-slate-700 rounded-xl pl-10 pr-4 py-2 text-sm text-slate-200 focus:outline-none focus:border-indigo-500 transition-colors">
            </div>

            <!-- Filtros -->
            <div class="flex flex-wrap items-center gap-3 w-full md:w-auto">
                <select id="filterCategory" class="border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="all">Todas as Categorias</option>
                    <option value="Atividade">Atividade</option>
                    <option value="Evento">Evento</option>
                    <option value="Reunião">Reunião</option>
                    <option value="Tarefa">Tarefa</option>
                </select>

                <select id="filterStatus" class="border border-slate-700 rounded-xl px-3 py-2 text-sm text-slate-300 focus:outline-none focus:border-indigo-500">
                    <option value="all">Todos os Status</option>
                    <option value="Concluída">Concluída</option>
                    <option value="Pendente">Pendente</option>
                    <option value="Atrasada">Atrasada</option>
                </select>
            </div>
        </section>

        <!-- Container das Anotações -->
        <section id="notesGrid" class="grid grid-cols-1 md:grid-cols-2 lg:grid-cols-3 gap-6"></section>

        <!-- Estado Vazio -->
        <div id="emptyState" class="hidden text-center py-16 space-y-4">
            <div class="w-16 h-16 mx-auto bg-slate-800 border border-slate-700 rounded-full flex items-center justify-center text-slate-500 text-2xl">
                <i class="fa-regular fa-folder-open"></i>
            </div>
            <p class="text-slate-400 font-medium">Nenhuma anotação encontrada.</p>
            <p class="text-xs text-slate-500">Crie uma nova anotação ou altere os filtros de busca.</p>
        </div>
    </main>

    <!-- Modal do Formulário (Criar / Editar) -->
    <div id="noteModal" class="fixed inset-0 bg-slate-950/80 backdrop-blur-sm z-50 flex items-center justify-center p-4 hidden">
        <div class="bg-slate-800 border border-slate-700 rounded-2xl w-full max-w-lg overflow-hidden shadow-2xl transition-all">
            <div class="px-6 py-4 border-b border-slate-700 flex items-center justify-between">
                <h3 id="modalTitle" class="text-lg font-bold text-white">Nova Anotação</h3>
                <button id="btnCloseModal" class="text-slate-400 hover:text-white p-1 rounded-lg transition-colors">
                    <i class="fa-solid fa-xmark text-lg"></i>
                </button>
            </div>

            <form id="noteForm" class="p-6 space-y-4">
                <input type="hidden" id="noteId">

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Título *</label>
                    <input type="text" id="noteTitle" required placeholder="Ex: Reunir com equipe de Devs" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Descrição</label>
                    <textarea id="noteDescription" rows="3" placeholder="Detalhes ou observações importantes..." class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500 resize-none"></textarea>
                </div>

                <div class="grid grid-cols-1 sm:grid-cols-2 gap-4">
                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Categoria *</label>
                        <select id="noteCategory" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="Atividade">Atividade</option>
                            <option value="Evento">Evento</option>
                            <option value="Reunião">Reunião</option>
                            <option value="Tarefa" selected>Tarefa</option>
                        </select>
                    </div>

                    <div>
                        <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Status *</label>
                        <select id="noteStatus" required class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                            <option value="Pendente">Pendente</option>
                            <option value="Concluída">Concluída</option>
                            <option value="Atrasada">Atrasada</option>
                        </select>
                    </div>
                </div>

                <div>
                    <label class="block text-xs font-semibold uppercase tracking-wider text-slate-300 mb-1">Data e Hora de Vencimento</label>
                    <input type="datetime-local" id="noteDatetime" class="w-full bg-slate-900 border border-slate-700 rounded-xl px-4 py-2.5 text-slate-100 text-sm focus:outline-none focus:border-indigo-500">
                </div>

                <div class="pt-4 flex items-center justify-end space-x-3 border-t border-slate-700/60">
                    <button type="button" id="btnCancelModal" class="px-4 py-2 bg-slate-700 hover:bg-slate-600 text-slate-200 text-sm font-medium rounded-xl transition-colors">
                        Cancelar
                    </button>
                    <button type="submit" class="px-5 py-2 bg-indigo-600 hover:bg-indigo-500 text-white text-sm font-medium rounded-xl shadow-lg shadow-indigo-600/30 transition-all">
                        Salvar
                    </button>
                </div>
            </form>
        </div>
    </div>

    <!-- Container de Notificações Toast -->
    <div id="toastContainer" class="fixed bottom-5 right-5 z-50 flex flex-col space-y-2"></div>

    <script src="script/script.js"></script>
</body>
</html>
